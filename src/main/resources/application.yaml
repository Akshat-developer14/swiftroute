spring:
  application:
    name: swiftroute
  profiles:
    active: dev
  datasource:
    url: ${SUPABASE_DB_URI}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  data:
    redis:
      url: ${REDIS_DB_URI}
      timeout: 5000ms

jwt:
  # 256 bit base64 encoded secret key
  secret: ${JWT_SECRET_KEY}
  access-token-expiration: 900000     # 15 minutes in milliseconds
  refresh-token-expiration: 604800000 # 7 days in milliseconds
